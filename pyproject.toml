[project]
name = "rosetta-build"
version = "0.1.2"
description = "Flat (non-meta) multilanguage build tool with a Python planner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ralian", email = "wbowers314@gmail.com" }
]
requires-python = ">=3.14"
keywords = [
    "build",
    "c++",
    "modules",
    "packaging",
    "pep517",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/ralian/rosetta-build"
Repository = "https://github.com/ralian/rosetta-build"
Issues = "https://github.com/ralian/rosetta-build/issues"

[project.scripts]
rosetta-build = "rosetta_build.cli:main"

[build-system]
requires = ["rosetta-build>=0.1.1"]
build-backend = "rosetta_build.backend"

[tool.rosetta-build]
targets = ["src/target.toml"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = [
    "^tests/trees/",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
