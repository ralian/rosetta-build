[project]
name = "rosetta-build"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ralian", email = "wbowers314@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
rosetta-build = "rosetta_build.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = [
    "^tests/trees/",
]

